<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orbit Render E2E</title><style>body {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;background-color: #0f172a;color: #f8fafc;display: flex;flex-direction: column;justify-content: center;align-items: center;height: 100vh;margin: 0;}.banner {background-color: #dc2626;color: #ffffff;width: 100%;text-align: center;padding: 0.75rem 0;font-weight: bold;font-size: 1.2rem;letter-spacing: 0.05em;box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);position: fixed;top: 0;left: 0;z-index: 1000;}.card {background-color: #1e293b;padding: 2rem 3rem;border-radius: 12px;box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);text-align: center;border: 1px solid #334155;margin-top: 3rem;}h1 {margin: 0 0 1rem 0;font-size: 1.5rem;color: #38bdf8;}p {margin: 0;font-size: 1.1rem;color: #94a3b8;}form {margin-top: 1.5rem;display: flex;flex-direction: column;gap: 0.75rem;}input {padding: 0.5rem;border-radius: 4px;border: 1px solid #334155;background: #0f172a;color: #fff;font-size: 1rem;}</style></head><body><div class="banner">MODIFIED BY E2E TEST</div><div class="card"><h1>Orbit Minimal UI</h1><p id="greeting">Loading greeting from backend...</p><form id="login-form"><input type="email" name="email" placeholder="Enter email" required /><button type="submit" class="submit" style="padding: 0.5rem; background: #38bdf8; border: none; border-radius: 4px; font-weight: bold; color: #0f172a; cursor: pointer;">Submit</button></form></div><script src="/app.js"></script></body></html>
